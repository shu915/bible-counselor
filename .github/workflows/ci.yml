name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じ PR に続けて push したら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # テストは、DB も Redis も AI も使わない(偽物に差し替える)
    steps:
      - uses: actions/checkout@v7
        with:
          # GITHUB_TOKEN を .git に残さない(後続の npm ci のスクリプトから読まれないように)
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run build
